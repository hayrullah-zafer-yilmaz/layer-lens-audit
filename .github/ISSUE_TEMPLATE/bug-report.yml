name: Something else went wrong
description: An error, a panel that looks wrong, a command that fails.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      description: The page or the command, and the steps.
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Browser or Node version, operating system and layer-lens-audit version
      placeholder: Chrome 140 on macOS 26, Node 24, layer-lens-audit 0.1.0
